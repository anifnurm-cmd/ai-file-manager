name: Windows Simulation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Windows Python 3.13 full simulation
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip setuptools wheel && python -m pip install --prefer-binary -r requirements.txt
      - name: Dependency check
        run: python -m pip check
      - name: Compile application
        run: python -m py_compile app.py
      - name: Run complete application tests
        run: python -m pytest -q
      - name: Verify application import
        run: python -c "import app; print('Application import OK')"
