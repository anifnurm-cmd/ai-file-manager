name: Validate Python source repair

on:
  push:
    branches: [fix/validate-python-syntax]

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair future import in isolated branch
        shell: pwsh
        run: |
          $p = Get-Content -Raw app.py
          $p = $p -replace '^from __future__\s*$', 'from __future__ import annotations'
          Set-Content -Path app.py -Value $p -Encoding utf8NoBOM

      - name: Install Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --prefer-binary -r requirements.txt

      - name: Compile
        run: python -m py_compile app.py

      - name: Import application
        run: python -c "import app; print('Application import OK')"

      - name: Commit validated repair to branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if (git diff --cached --quiet) { Write-Host 'No repair needed'; exit 0 }
          git commit -m "fix: repair Python future import"
          git push